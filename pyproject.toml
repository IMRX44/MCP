[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ce-mcp"
version = "1.0.0"
description = "A Model Context Protocol server that gives AI agents full control of Cheat Engine."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Your Name" }]
keywords = ["mcp", "cheat-engine", "memory", "reverse-engineering", "game-hacking", "ai-agent"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Software Development :: Debuggers",
]
dependencies = [
    "mcp[cli]>=1.2.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
ce-mcp = "ce_mcp.server:main"

[project.urls]
Homepage = "https://github.com/imrx44/mcp"
Repository = "https://github.com/imrx44/mcp"

[tool.hatch.build.targets.wheel]
packages = ["src/ce_mcp"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
